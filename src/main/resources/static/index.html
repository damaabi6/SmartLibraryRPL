<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
</head>
<body>
  <h1>Login</h1>

  <form id="form-login">
    <p><label>Username<br><input type="text" name="username" required></label></p>
    <p><label>Password<br><input type="password" name="password" required></label></p>
    <button type="submit">Login</button>
  </form>

  <p id="pesan"></p>
  <p>Belum punya akun? <a href="signup.html">Daftar</a></p>

  <script>
    if (sessionStorage.getItem("pengguna")) location.href = "home.html";

    const form = document.getElementById("form-login");
    const pesan = document.getElementById("pesan");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(form));

      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        if (res.ok) {
          const pengguna = await res.json();
          sessionStorage.setItem("pengguna", JSON.stringify(pengguna));
          location.href = "home.html";
        } else if (res.status === 401) {
          pesan.textContent = "Username atau password salah.";
        } else {
          pesan.textContent = "Gagal login (status " + res.status + ").";
        }
      } catch (err) {
        pesan.textContent = "Tidak bisa terhubung ke server.";
      }
    });
  </script>
</body>
</html>
